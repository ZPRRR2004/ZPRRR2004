name: Update contribution constellation

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/constellation.py
      - .github/workflows/constellation.yml

permissions:
  contents: write

concurrency:
  group: contribution-constellation
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Draw the constellation
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/constellation.py
      - name: Save updated sky
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-constellation.svg README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh contribution constellation'
          git push
