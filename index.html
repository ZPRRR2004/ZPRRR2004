<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hi, I'm Zeping</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
<style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;height:100%;font-family:system-ui,sans-serif}body{overflow:hidden}h1{z-index:1;text-shadow:0 0 26px #a4c5fa55;position:absolute;top:13%;width:100%;text-align:center;font-size:clamp(18px,3vw,26px);font-weight:400;letter-spacing:.03em;pointer-events:none;margin:0}svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}button{position:absolute;bottom:28px;right:28px;background:transparent;color:#999;border:0;font:14px system-ui;cursor:pointer;padding:12px}button:hover,button:focus-visible{color:white}#status{position:absolute;top:50%;text-align:center;width:100%;color:#888;font-size:14px}.star{cursor:grab;outline:none}.star:focus-visible .core{stroke:white;stroke-width:2}.star:active{cursor:grabbing}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head>
<body><h1>Hi, I’m Zeping 👋</h1><svg id="sky" aria-label="Drag the stars. Focus a star and use arrow keys to move it." role="group"></svg><p id="status" role="status">Loading stars…</p><button id="reset" title="Return stars to their original positions">Reset</button>
<script>
const NS='http://www.w3.org/2000/svg',sky=document.querySelector('#sky'),status=document.querySelector('#status');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let stars=[],edges=[],drag=null,W=innerWidth,H=innerHeight;
function el(tag,attrs,parent=sky){const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}
function layout(){W=innerWidth;H=innerHeight;sky.setAttribute('viewBox',`0 0 ${W} ${H}`);for(const s of stars){s.homeX=(.07+.86*s.nx)*W;s.homeY=(.35+.42*s.ny)*H;s.x=s.homeX;s.y=s.homeY;s.vx=s.vy=0}draw()}
function draw(){for(const s of stars)s.g.setAttribute('transform',`translate(${s.x},${s.y})`);for(const e of edges){e.line.setAttribute('x1',stars[e.a].x);e.line.setAttribute('y1',stars[e.a].y);e.line.setAttribute('x2',stars[e.b].x);e.line.setAttribute('y2',stars[e.b].y)}}
function tick(){for(const s of stars){if(drag===s||s.focused)continue;s.vx=(s.vx+(s.homeX-s.x)*.012)*.88;s.vy=(s.vy+(s.homeY-s.y)*.012)*.88;s.x+=s.vx;s.y+=s.vy}draw();requestAnimationFrame(tick)}
function pointer(e){const b=sky.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height}}
sky.addEventListener('pointermove',e=>{if(!drag)return;const p=pointer(e);drag.x=Math.max(12,Math.min(W-12,p.x));drag.y=Math.max(12,Math.min(H-12,p.y));drag.vx=drag.vy=0;draw()});
function release(){if(drag&&reduced){drag.x=drag.homeX;drag.y=drag.homeY}drag=null;draw()}
sky.addEventListener('pointerup',release);sky.addEventListener('pointercancel',release);sky.addEventListener('lostpointercapture',release);
document.querySelector('#reset').onclick=()=>{drag=null;for(const s of stars){s.x=s.homeX;s.y=s.homeY;s.vx=s.vy=0}draw()};addEventListener('resize',layout);
async function init(){try{const r=await fetch('./assets/contribution-constellation.svg',{cache:'no-cache'});if(!r.ok)throw Error('load');const doc=new DOMParser().parseFromString(await r.text(),'image/svg+xml');if(doc.querySelector('parsererror'))throw Error('svg');sky.innerHTML='<defs><radialGradient id="glow"><stop stop-color="white" stop-opacity=".4"/><stop offset=".25" stop-color="white" stop-opacity=".12"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient></defs>';
sky.innerHTML='';sky.append(document.importNode(doc.querySelector('defs'),true));const bg=el('svg',{x:0,y:0,width:'100%',height:'100%',viewBox:'0 0 1000 360',preserveAspectRatio:'xMidYMid slice','pointer-events':'none'});for(const node of doc.documentElement.children){if(['rect','ellipse'].includes(node.tagName)||node.hasAttribute('data-dust'))bg.append(document.importNode(node,true));}const lineLayer=el('g',{});for(const group of doc.querySelectorAll('g[data-star]')){const circles=group.querySelectorAll('circle');if(circles.length!==2)continue;const core=circles[1],x=+core.getAttribute('cx'),y=+core.getAttribute('cy'),label=group.querySelector('title')?.textContent||'Star';const g=el('g',{class:'star',tabindex:'0',role:'button','aria-label':label+'. Drag or use arrow keys.'});el('circle',{r:20,fill:'transparent'},g);el('circle',{r:+circles[0].getAttribute('r'),fill:'url(#glow)'},g);el('circle',{r:+core.getAttribute('r'),fill:'white',class:'core',opacity:core.getAttribute('opacity')||1},g);const arm=+core.getAttribute('r')*4.5;const ray=el('g',{'pointer-events':'none'},g);el('rect',{x:-arm,y:-.35,width:arm*2,height:.7,fill:'url(#ray)'},ray);el('rect',{x:-arm,y:-.35,width:arm*2,height:.7,fill:'url(#ray)',transform:'rotate(90)'},ray);const s={g,nx:(x-60)/880,ny:(y-75)/210,x:0,y:0,vx:0,vy:0,focused:false};stars.push(s);g.addEventListener('pointerdown',e=>{e.preventDefault();drag=s;sky.setPointerCapture(e.pointerId)});g.addEventListener('focus',()=>s.focused=true);g.addEventListener('blur',()=>{s.focused=false;if(reduced){s.x=s.homeX;s.y=s.homeY;draw()}});g.addEventListener('keydown',e=>{const delta={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]}[e.key];if(delta){e.preventDefault();s.x=Math.max(12,Math.min(W-12,s.x+delta[0]));s.y=Math.max(12,Math.min(H-12,s.y+delta[1]));draw()}if(e.key==='Escape'){s.x=s.homeX;s.y=s.homeY;draw()}})}
for(const line of doc.querySelectorAll('line[data-a]')){const a=+line.dataset.a,b=+line.dataset.b;if(stars[a]&&stars[b])edges.push({a,b,line:el('line',{stroke:'#a2c7ef','stroke-opacity':'.24','stroke-width':'.7'},lineLayer)})}if(!stars.length)throw Error('empty');status.remove();layout();if(!reduced)requestAnimationFrame(tick);
}catch(e){status.textContent='Stars are unavailable. Please refresh.'}}
init();
</script></body></html>
